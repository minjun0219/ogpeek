name: Release

on:
  push:
    branches: [main]

# changesets/action 이 Version PR 브랜치를 push 하고 PR 을 열 수 있어야 함
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version PR / cut release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.gh_release.outputs.release_created }}
      tag_name: ${{ steps.gh_release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # publish 입력을 지정하지 않음 → Version PR 생성/갱신만, 여기서 npm
      # publish 없음 (게시는 아래 publish job 들이 담당). version 커맨드를
      # 오버라이드해 changeset version 뒤 루트 package.json 과 확장
      # manifest/*.json 버전을 sync 한다.
      - name: Create Version Packages PR
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          title: "chore(release): Version Packages"
          commit: "chore(release): Version Packages (CHANGELOG + version sync)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Version PR 이 병합돼 main 버전이 오르면 v<version> 태그 + GitHub
      # Release 를 생성하고 release_created / tag_name 을 출력한다 (멱등 —
      # Release 가 이미 있으면 skip). changeset 이 남아 있는 push(=Version
      # PR 생성 단계)에서는 버전이 아직 안 올랐으므로 skip 된다.
      - name: Tag + GitHub Release on version bump
        id: gh_release
        run: node scripts/release-github.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-ogpeek:
    name: Publish ogpeek to npm
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -F ogpeek typecheck

      - name: Test
        run: pnpm -F ogpeek test

      - name: Build
        run: pnpm -F ogpeek build

      - name: Publish to npm
        working-directory: packages/ogpeek
        env:
          # secrets.NPM_AUTH_TOKEN 이 비어있으면 npm CLI 가 OIDC(Trusted
          # Publisher) 로 폴백한다.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: pnpm publish --access public --provenance --no-git-checks

  publish-ogpeek-react:
    name: Publish @ogpeek/react to npm
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @ogpeek/react 는 ogpeek/dist 의 타입을 참조하므로 먼저 빌드해 둔다.
      - name: Build ogpeek
        run: pnpm -F ogpeek build

      - name: Typecheck
        run: pnpm -F @ogpeek/react typecheck

      - name: Test
        run: pnpm -F @ogpeek/react test

      - name: Build
        run: pnpm -F @ogpeek/react build

      - name: Publish to npm
        working-directory: packages/ogpeek-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: pnpm publish --access public --provenance --no-git-checks

  publish-ogpeek-extension:
    name: Build and upload Chrome extension zip to GitHub Release
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ogpeek-extension 는 workspace 의 ogpeek / @ogpeek/react 를 번들하므로
      # 두 라이브러리를 먼저 빌드해 둔다. 루트의 libs:build 는 website 의존
      # 그래프에 묶여 있어서 (`--filter 'website^...'`) 의존 관계가 바뀌면 깨질
      # 수 있으므로, 여기서는 명시적으로 두 라이브러리를 직접 빌드한다.
      - name: Build ogpeek
        run: pnpm -F ogpeek build

      - name: Build @ogpeek/react
        run: pnpm -F @ogpeek/react build

      - name: Typecheck
        run: pnpm -F ogpeek-extension typecheck

      # package:chrome 은 내부에서 다시 libs:build 를 호출하므로 위에서 이미
      # 빌드한 라이브러리를 두 번 빌드하게 된다. 이를 피하려고 build:chrome 만
      # 호출한 뒤 zip 스크립트를 직접 실행한다.
      - name: Build Chrome extension
        run: pnpm -F ogpeek-extension build:chrome

      - name: Package zip
        working-directory: packages/ogpeek-extension
        run: node ./scripts/zip.mjs chrome

      - name: Upload zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber "${{ needs.release.outputs.tag_name }}" packages/ogpeek-extension/dist/ogpeek-chrome.zip

      # Chrome Web Store 자동 게시. 첫 수동 업로드로 익스텐션 ID 를 받고
      # 4 개의 secrets 와 vars.CHROME_AUTOPUBLISH=true 를 채운 다음부터
      # 동작한다 (자세한 절차는 AGENTS.md `## Releases` 참고). 변수가
      # 비어 있으면 step 자체가 skip 되므로 첫 릴리스 사이클을 깨지 않는다.
      # `--auto-publish` 는 업로드 직후 심사 제출까지 한 번에 수행한다 —
      # 실제 공개 시점은 Google 심사 결과에 달려 있다.
      - name: Upload and publish to Chrome Web Store
        if: ${{ vars.CHROME_AUTOPUBLISH == 'true' }}
        working-directory: packages/ogpeek-extension
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: npx -y chrome-webstore-upload-cli@3 upload --source dist/ogpeek-chrome.zip --auto-publish
