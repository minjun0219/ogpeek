name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: biome (format + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm exec biome ci

      # Context7 reads this file to serve ogpeek docs to coding agents. Past a
      # limit (200-char description, 255-char rules, …) it rejects or truncates
      # the file, so validate against the schema Context7 publishes right now.
      # Context7 이 이 파일을 읽어 코딩 에이전트에게 ogpeek 문서를 준다. 한도(설명 200자,
      # 규칙 255자 등)를 넘기면 거절되거나 잘리므로, Context7 이 지금 공개한 스키마로 검증한다.
      - name: Validate context7.json
        run: |
          curl -sSfL --retry 3 https://context7.com/schema/context7.json -o "$RUNNER_TEMP/context7.schema.json"
          npx -y -p ajv-cli@5 -p ajv-formats@3 ajv validate -c ajv-formats \
            -s "$RUNNER_TEMP/context7.schema.json" -d context7.json

  build-test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the two libraries once, in topo order. Downstream steps below
      # consume dist/ and skip rebuilding (we bypass the website typecheck
      # script's own libs:build chain to avoid the second compile).
      - name: Build libraries
        run: pnpm libs:build

      - name: Typecheck ogpeek
        run: pnpm -F ogpeek typecheck

      - name: Typecheck @ogpeek/react
        run: pnpm -F @ogpeek/react typecheck

      - name: Typecheck website
        working-directory: website
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm -r --filter './packages/*' test

  extension-bundle:
    name: extension (chrome zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `package:chrome` chains through `pnpm build` (which runs
      # libs:build first), then runs the zip script. The artifact below
      # makes the unpacked extension downloadable from the workflow run
      # page so reviewers can side-load it without a local toolchain.
      - name: Build + zip Chrome extension
        run: pnpm -F ogpeek-extension package:chrome

      - name: Upload Chrome zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogpeek-chrome-${{ github.sha }}
          path: packages/ogpeek-extension/dist/ogpeek-chrome.zip
          if-no-files-found: error
          retention-days: 30
